name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [development]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # read the PR title
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The subject "{subject}" must not start with an uppercase letter.

  emoji:
    name: emoji
    # Fork and Dependabot PRs get a read-only token and cannot be retitled
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # edit the PR title
    steps:
      - name: Add the type's gitmoji to the title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Gitmoji (https://gitmoji.dev) for each Conventional Commits type
          declare -A emoji=(
            [feat]='✨' [fix]='🐛' [docs]='📝' [style]='🎨' [refactor]='♻️' [perf]='⚡️'
            [test]='✅' [build]='📦️' [ci]='👷' [chore]='🔧' [revert]='⏪️'
          )
          # A title that breaks the convention is the pr-title job's to report
          re='^([a-z]+)(\([^)]*\))?!?: (.*)$'
          [[ $TITLE =~ $re && -v emoji[${BASH_REMATCH[1]}] ]] || exit 0
          type=${BASH_REMATCH[1]}
          subject=${BASH_REMATCH[3]}
          # Drop the emoji of an earlier type, so changing the type swaps it
          for e in "${emoji[@]}"; do subject=${subject#"$e "}; done
          title="${TITLE%%: *}: ${emoji[$type]} $subject"
          [[ $title == "$TITLE" ]] || gh pr edit "$PR_NUMBER" --title "$title"
