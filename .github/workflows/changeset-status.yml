name: Changeset status

# Comments on each PR whether it has a changeset and which packages it releases.
# It never blocks a merge: tests, docs and tooling need no changeset.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [development]

permissions: {}

concurrency:
  group: changeset-status-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-status:
    name: pr-status
    # Fork and Dependabot PRs get a read-only token and cannot be commented on;
    # the version PR never has changesets
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
      && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out the repo
    outputs:
      comment-body: ${{ steps.pr-status.outputs.comment-body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pr-status
        uses: changesets/action/pr-status@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  pr-comment:
    name: pr-comment
    needs: pr-status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # create and update the status comment
    steps:
      - uses: changesets/action/pr-comment@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          body: ${{ needs.pr-status.outputs.comment-body }}
